name: Build Android APK

on:
  # 手动触发：GitHub 仓库页 → Actions → Build Android APK → Run workflow
  workflow_dispatch:
  # 每次推代码自动打包
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      # 补齐本仓库未提交的平台壳文件（gradle wrapper / 资源图标等），
      # 已存在的 main.dart、MainActivity.kt、build.gradle 等不会被覆盖
      - name: 生成缺失的工程文件
        run: flutter create . --org com.pocketkitty --project-name pocket_kitty --platforms android

      - name: 拉取依赖
        run: flutter pub get

      - name: 打包 APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: pocket-kitty-apk
          path: build/app/outputs/flutter-apk/app-release.apk
